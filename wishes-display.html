<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ lời chúc — Thành Trung & Nhật Trang</title>
<meta name="theme-color" content="#f8e7e5">
<style>
:root {
  --ivory:#fffaf8;
  --blush:#f8e7e5;
  --rose:#b86b78;
  --rose-deep:#7e4b56;
  --ink:#3f3033;
  --soft:#ead5d5;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Georgia,"Times New Roman",serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 28%),
    radial-gradient(circle at 80% 70%, rgba(255,220,226,.65), transparent 30%),
    linear-gradient(135deg,#fffaf8 0%,#f8e7e5 48%,#fff7f5 100%);
}
.stage{
  position:relative;width:100vw;height:100vh;display:grid;place-items:center;
  isolation:isolate;
}
.stage::before,.stage::after{
  content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;z-index:-1;
}
.stage::before{width:38vw;height:38vw;left:-10vw;top:-12vw;background:rgba(230,164,174,.28)}
.stage::after{width:34vw;height:34vw;right:-9vw;bottom:-12vw;background:rgba(248,199,207,.32)}
.top{position:absolute;top:4.5vh;left:0;right:0;text-align:center}
.kicker{font:600 12px/1.2 Arial,sans-serif;letter-spacing:.35em;color:#8e6870}
.names{margin-top:1.1vh;font-size:clamp(26px,4vw,54px);letter-spacing:.08em;color:#4b363a}
.names span{color:var(--rose)}
.card{
  width:min(76vw,980px);min-height:min(58vh,620px);padding:7vh 8vw;
  background:rgba(255,250,248,.78);
  border:1px solid rgba(184,107,120,.18);
  box-shadow:0 30px 80px rgba(126,75,86,.12),0 0 0 10px rgba(255,255,255,.28);
  backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
}
.label{font:600 11px/1.2 Arial,sans-serif;letter-spacing:.34em;color:#9b727b;margin-bottom:2.2vh}
.ornament{font-size:26px;color:var(--rose);margin-bottom:1vh}
.message{
  font-size:clamp(28px,4.2vw,64px);line-height:1.18;color:#5a3f44;
  max-width:850px;margin:0 auto 3vh;
}
.message::before{content:"“";color:var(--rose);font-size:1.2em;vertical-align:-.15em;margin-right:.08em}
.message::after{content:"”";color:var(--rose);font-size:1.2em;vertical-align:-.15em;margin-left:.08em}
.from{font-size:clamp(18px,2.1vw,30px);letter-spacing:.06em;color:#8e5964}
.time{margin-top:2.2vh;font:500 10px/1.2 Arial,sans-serif;letter-spacing:.18em;color:#aa8c91;text-transform:uppercase}
.footer{position:absolute;bottom:4vh;left:0;right:0;text-align:center}
.footer .small{font:500 10px/1.2 Arial,sans-serif;letter-spacing:.32em;color:#96767d}
.progress{position:absolute;left:7vw;right:7vw;bottom:1.8vh;height:2px;background:rgba(126,75,86,.12);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:rgba(184,107,120,.65)}
.fade{animation:fadeIn .75s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.empty{font-size:clamp(22px,3vw,40px);color:#8e7479}
@media (orientation:portrait){
  .card{width:88vw;min-height:52vh;padding:7vh 8vw}
  .top{top:3vh}
  .footer{bottom:4vh}
}
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <div class="kicker">DIGITAL GUESTBOOK</div>
    <div class="names">THÀNH TRUNG <span>&amp;</span> NHẬT TRANG</div>
  </div>

  <main class="card" id="card">
    <div class="label">LỜI CHÚC TỪ NHỮNG NGƯỜI THƯƠNG</div>
    <div class="ornament">♡</div>
    <div class="message" id="message">Đang chờ những lời chúc đầu tiên...</div>
    <div class="from" id="from"></div>
    <div class="time" id="time"></div>
  </main>

  <div class="footer">
    <div class="small">WEDDING 2027 · WITH LOVE</div>
  </div>
  <div class="progress"><i id="progress"></i></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  orderBy,
  limit,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8Q_J2p6U6at2HeWfdc6bqEh04AfoDy0Q",
  authDomain: "trung-trang-wedding-2027.firebaseapp.com",
  projectId: "trung-trang-wedding-2027",
  storageBucket: "trung-trang-wedding-2027.firebasestorage.app",
  messagingSenderId: "594388235466",
  appId: "1:594388235466:web:a10a124d5f07ef8f423033"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const messageEl = document.getElementById("message");
const fromEl = document.getElementById("from");
const timeEl = document.getElementById("time");
const card = document.getElementById("card");
const progress = document.getElementById("progress");

let wishes = [];
let currentIndex = 0;
let timer = null;
let progressTimer = null;
const DISPLAY_MS = 7000;

function formatTime(timestamp) {
  if (!timestamp || typeof timestamp.toDate !== "function") return "";
  return timestamp.toDate().toLocaleString("vi-VN", {
    day: "2-digit", month: "2-digit", year: "numeric"
  });
}

function showWish(index) {
  if (!wishes.length) {
    messageEl.textContent = "Đang chờ những lời chúc đầu tiên...";
    fromEl.textContent = "";
    timeEl.textContent = "";
    return;
  }

  const wish = wishes[index];
  card.classList.remove("fade");
  void card.offsetWidth;
  card.classList.add("fade");

  messageEl.textContent = wish.message || "Một lời chúc thật đẹp ♡";
  fromEl.textContent = wish.name ? "— " + wish.name + " —" : "";
  timeEl.textContent = formatTime(wish.createdAt);

  progress.style.width = "0%";
  clearInterval(progressTimer);
  const started = performance.now();
  progressTimer = setInterval(() => {
    const pct = Math.min(100, ((performance.now() - started) / DISPLAY_MS) * 100);
    progress.style.width = pct + "%";
    if (pct >= 100) clearInterval(progressTimer);
  }, 50);
}

function restartSlideshow() {
  clearInterval(timer);
  currentIndex = 0;
  showWish(currentIndex);

  timer = setInterval(() => {
    if (!wishes.length) return;
    currentIndex = (currentIndex + 1) % wishes.length;
    showWish(currentIndex);
  }, DISPLAY_MS);
}

const wishesQuery = query(
  collection(db, "wedding_wishes"),
  orderBy("createdAt", "desc"),
  limit(100)
);

onSnapshot(wishesQuery, snapshot => {
  wishes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  restartSlideshow();
}, error => {
  console.error("Wishes display error:", error);
  messageEl.textContent = "Chưa thể tải lời chúc.";
  fromEl.textContent = "Vui lòng kiểm tra kết nối Firebase.";
});
</script>
</body>
</html>
